[package]
name = "grafana_watch_dog"
version = "0.1.0"
description = "Read-only Grafana AI operations watch dog"
authors = ["AI Ops Daily contributors"]
edition = "2021"

[lib]
name = "grafana_watch_dog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
ico = "0.5"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
