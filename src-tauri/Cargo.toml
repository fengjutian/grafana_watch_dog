[package]
name = "ai-ops-daily"
version = "0.1.0"
description = "Read-only AI operations daily report desktop app"
authors = ["AI Ops Daily contributors"]
edition = "2021"

[lib]
name = "ai_ops_daily_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

